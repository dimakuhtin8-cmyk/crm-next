version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
      trpc:
        patterns:
          - '@trpc/*'
      firebase:
        patterns:
          - 'firebase'
          - 'firebase-admin'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'ci'
      - 'dependencies'
